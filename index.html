<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="round-div">
            <h1>Round</h1>
            <p id="round-number">1</p>
        </div>
        <h2 id="score-h2">Score</h2>
        <div class="score-div">
            <h2>Human</h2>
            <p id="human-score">0</p>
        </div>
        <div class="score-div">
            <h2>Computer</h2>
            <p id="computer-score">0</p>
        </div>
        <div class="choices-div">
            <button class="rps-btn" id="rock-btn">Rock 🪨</button>
            <button class="rps-btn" id="paper-btn">Paper 📄</button>
            <button class="rps-btn" id="scissors-btn">Scissors ✂️</button>
        </div>
        <div class="end"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
